name: Publish NuGet Package

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        required: true
        type: string
      VERSION:
        required: false
        type: string
        default: ''
    secrets:
      NUGET_USER:
        required: true
  workflow_dispatch:
    inputs:
      PROJECT_NAME:
        required: true
        type: choice
        options:
          - Blazor
          - Extensions
          - Mailing
          - Payout
      VERSION:
        required: false
        type: string
        description: 'Optional - pins the package version (e.g. to match a sibling package already published in this release, such as Devity.Extensions when publishing Devity.Mailing/Blazor standalone). Leave blank to auto-generate from the current date/time.'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets NuGet/login swap the GitHub OIDC token for a temporary nuget.org API key

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 3
      
    # - name: Check for changes
    #   if: github.event_name != 'workflow_dispatch'
    #   id: check-changes
    #   run: |
    #     changedFiles=$(git diff --name-only ${{ github.event.before }}..${{ github.event.after }} -- Devity.${{ inputs.PROJECT_NAME }})
    #     echo "Changed files: $changedFiles"
    #     echo "changes=${changedFiles//[$'\n\r']/ }" >> $GITHUB_OUTPUT

    - name: Setup .NET Core
      # if: steps.check-changes.outputs.changes != '' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Determine package version args
      id: pkgver
      shell: bash
      run: |
        if [ -n "${{ inputs.VERSION }}" ]; then
          echo "args=-p:PackageVersion=${{ inputs.VERSION }}" >> "$GITHUB_OUTPUT"
        else
          echo "args=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and test
      # if: steps.check-changes.outputs.changes != '' || github.event_name == 'workflow_dispatch'
      working-directory: ./Devity.${{ inputs.PROJECT_NAME }}
      run: |
        dotnet build --configuration Release ${{ steps.pkgver.outputs.args }}
        dotnet test --configuration Release --no-build

    - name: Package
      # if: steps.check-changes.outputs.changes != '' || github.event_name == 'workflow_dispatch'
      working-directory: ./Devity.${{ inputs.PROJECT_NAME }}
      run: dotnet pack --configuration Release --no-build ${{ steps.pkgver.outputs.args }}

    # Trusted publishing: the key it returns lasts one hour, so get it right before pushing.
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, not the email address

    - name: Publish
      # if: steps.check-changes.outputs.changes != '' || github.event_name == 'workflow_dispatch'
      working-directory: ./Devity.${{ inputs.PROJECT_NAME }}
      run: |
        cd bin
        ls
        dotnet nuget push */*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate